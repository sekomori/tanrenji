<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鍛錬寺 Big6</title>
<style>
  :root{
    --sumi:#0c0e12; --sumi2:#13161c; --washi:#ECE6D8; --sub:#8b8f99;
    --kin:#C8A24C; --kin2:#E6C97C; --shu:#B5462E; --ai:#6E93A6;
    --line:rgba(200,162,76,.16); --glass:rgba(236,230,216,.045); --glass2:rgba(236,230,216,.08);
    --serif:"Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; background:#000; font-family:var(--sans); color:var(--washi); }
  body{ display:flex; justify-content:center; }
  #app{ position:relative; width:100%; max-width:460px; min-height:100vh; background:var(--sumi); isolation:isolate; }
  #bg{ position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; height:100vh; z-index:0; pointer-events:none; overflow:hidden; }
  #bg .bgimg{ position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s; }
  #bg .bgimg.t1{ background-image:url('images/t1.png'); }
  #bg .bgimg.t2{ background-image:url('images/t2.png'); }
  #bg .bgimg.t3{ background-image:url('images/t3.png'); }
  #bg .vig{ position:absolute;inset:0;background:rgba(0,0,0,.45); }
  #main{ position:relative;z-index:1;padding:14px 14px 150px;min-height:100vh; }
  .scr{ animation:fade .22s ease; }
  @keyframes fade{ from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;} }

  /* ── 共通 ── */
  .brand{ display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px; }
  .logo{ font-family:var(--serif);font-size:22px;letter-spacing:.14em; }
  .logo b{ color:var(--kin); } .logo small{ font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--sub);margin-left:8px; }
  .ver{ font-size:12px;color:var(--sub);letter-spacing:.08em;margin-top:2px; }
  .bell{ position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--glass);cursor:pointer; }
  .bell .dot{ position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--shu); }
  .h{ font-family:var(--serif);font-size:15px;letter-spacing:.12em;margin:18px 2px 10px;color:var(--washi);display:inline-block;position:relative; }
  .h::after{ content:"";display:block;height:2px;margin-top:5px;border-radius:2px;background:linear-gradient(90deg,var(--kin),transparent); }
  .top{ display:flex;align-items:center;gap:10px;margin:4px 0 12px; }
  .back{ width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--washi);display:grid;place-items:center;cursor:pointer;font-size:18px; }
  .top .ttl{ font-family:var(--serif);font-size:17px;letter-spacing:.06em; }
  .top .ttl small{ display:block;font-family:var(--sans);font-size:12px;color:var(--sub);margin-top:1px; }
  .bar{ height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden; }
  .bar>i{ display:block;height:100%;background:linear-gradient(90deg,var(--kin),var(--kin2)); }
  .badge{ font-size:12px;background:var(--kin);color:#1a1407;padding:1px 7px;border-radius:9px;margin-left:6px;font-weight:700; }

  /* ── ホーム ── */
  .streak{ display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);margin-bottom:12px; }
  .streak .fire{ font-size:26px;filter:drop-shadow(0 0 6px rgba(181,70,46,.5)); }
  .streak .txt{ flex:1; }
  .streak .d{ font-family:var(--serif);font-size:17px; }
  .streak .r{ font-size:12px;color:var(--kin);margin-top:2px; }
  .restbtn{ padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--washi);font-size:12px;cursor:pointer;white-space:nowrap; }
  .xp{ padding:12px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin-bottom:6px; }
  .xp .row{ display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px; }
  .xp .row b{ color:var(--kin);font-family:var(--serif);font-size:13px; }
  .stack{ display:flex;flex-direction:column;gap:10px; }
  .card{ display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);cursor:pointer; }
  .card .body{ flex:1;min-width:0; }
  .card .nm{ font-size:15px;font-weight:600; }
  .card .st{ font-size:12px;color:var(--kin);margin-top:3px; }
  .card .chev{ color:var(--sub);font-size:20px;margin-left:6px; }
  .card.done{ border-color:var(--kin); }
  @keyframes flash{ 0%{background:rgba(200,162,76,.0);}40%{background:rgba(200,162,76,.32);}100%{background:rgba(200,162,76,.0);} }
  .flash{ animation:flash .35s ease; }

  /* ── ステップ一覧 ── */
  #steplist{ display:flex;flex-direction:column;gap:10px;padding-bottom:200px; }
  .srow{ display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);cursor:pointer; }
  .srow.current{ border-color:var(--kin);background:var(--glass2); }
  .srow.current .nm{ font-size:17px; }
  .srow.current .th{ width:82px;height:82px; }
  .srow .txt{ flex:1;min-width:0; }
  .srow .n{ font-size:12px;color:var(--sub);letter-spacing:.08em; }
  .srow .nm{ font-size:14px;font-weight:600;margin-top:2px; }
  .srow .th{ width:54px;height:54px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:12px;color:var(--sub);transition:width .15s,height .15s; }

  /* ── 記録画面 ── */
  .memo-prev{ border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:10px 13px;margin-bottom:10px; }
  .memo-prev .lbl{ font-size:12px;color:var(--kin);cursor:pointer;display:flex;justify-content:space-between; }
  .memo-prev .bd{ font-size:13px;color:var(--washi);margin-top:7px;line-height:1.5; }
  .recgrid{ display:flex;gap:10px;align-items:flex-start;margin-bottom:12px; }
  .recimg{ width:96px;height:96px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;gap:2px;cursor:pointer;position:relative; }
  .recimg .ph{ font-size:12px;color:var(--sub); }
  .recimg .tap{ position:absolute;bottom:5px;right:6px;font-size:12px;color:var(--kin); }
  .recmeta{ flex:1;min-width:0; }
  .recmeta .nm{ font-family:var(--serif);font-size:16px; }
  .recmeta .sn{ font-size:12px;color:var(--sub);margin-top:2px; }
  .stds{ display:flex;gap:7px;margin-top:9px; }
  .std{ flex:1;text-align:center;padding:7px 3px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:all .12s; }
  .std .l{ font-size:12px;color:var(--sub); }
  .std .v{ font-size:13px;font-weight:700;margin-top:2px; }
  .std.sel{ background:rgba(200,162,76,.16);border-color:var(--kin); }
  .std.sel .l{ color:var(--kin); }
  .inrow{ display:flex;gap:8px;align-items:flex-end;margin-bottom:9px; }
  .inrow .f{ flex:1; }
  .inrow .f label{ font-size:12px;color:var(--sub);display:block;margin-bottom:4px; }
  .inrow input{ width:100%;background:var(--sumi2);border:1px solid var(--line);border-radius:9px;color:var(--washi);padding:11px 10px;font-size:16px; }
  .recbtn{ flex:1.1;background:linear-gradient(135deg,var(--kin),var(--kin2));color:#1a1407;border:none;border-radius:9px;padding:12px 6px;font-weight:700;font-size:14px;cursor:pointer;height:44px; }
  .memrow{ display:flex;gap:8px;margin-bottom:6px; }
  .memrow input{ flex:1;background:var(--sumi2);border:1px solid var(--line);border-radius:9px;color:var(--washi);padding:11px 10px;font-size:15px; }
  .histbtn{ flex:0 0 auto;width:48px;border-radius:9px;border:1px solid var(--line);background:var(--glass);color:var(--kin);font-size:18px;cursor:pointer; }
  .divider{ height:1px;background:var(--line);margin:16px 0 6px; }
  .chartbox{ border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:12px 10px 6px; }
  .legend{ display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);margin-top:6px; }
  .legend i{ display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle; }
  .log{ padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer; }
  .log .lr{ display:flex;justify-content:space-between;font-size:13px;align-items:center; }
  .log .d{ color:var(--sub);display:flex;align-items:center;gap:6px; }
  .log .r{ font-weight:700; }
  .itag{ font-size:12px;padding:1px 6px;border-radius:8px;color:#0c0c0c;font-weight:700; }
  .log .ln{ font-size:12px;color:var(--sub);margin-top:5px;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:8px;display:none; }
  .log.open .ln{ display:block; }
  .log .memo-hint{ font-size:12px;color:var(--kin);margin-left:4px; }

  /* XP獲得演出 */
  #xpPop{ position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;pointer-events:none;display:none;text-align:center; }
  #xpPop .xpnum{ font-family:var(--serif);font-size:54px;color:var(--kin2);text-shadow:0 0 20px rgba(200,162,76,.8),0 0 40px rgba(200,162,76,.4);animation:xpbounce .6s ease; }
  #xpPop .xplabel{ font-size:16px;color:var(--washi);letter-spacing:.1em;margin-top:4px; }
  .sparkle{ position:absolute;border-radius:50%;animation:spark 1s ease forwards; }
  @keyframes xpbounce{ 0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;} }
  @keyframes spark{ 0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);} }

  /* ── 試練 ── */
  .mission{ border:1px solid var(--line);border-radius:16px;background:var(--glass);padding:16px;margin-bottom:14px; }
  .mission .t{ font-family:var(--serif);font-size:16px; }
  .mission .pr{ font-size:12px;color:var(--sub);margin:10px 0 6px;display:flex;justify-content:space-between; }
  .relics{ display:grid;grid-template-columns:repeat(4,1fr);gap:10px; }
  .relic{ aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;text-align:center;gap:3px;font-size:12px;color:var(--sub);cursor:pointer; }
  .relic .em{ font-size:24px; }
  .relic.locked{ opacity:.32; }
  .relic.got{ border-color:var(--kin);color:var(--washi); }
  .relic.got .em{ filter:drop-shadow(0 0 5px rgba(200,162,76,.5)); }

  /* ── フレンドタブ ── */
  .react-hist{ border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:13px;margin-bottom:10px; }
  .react-row{ display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line); }
  .react-row:last-child{ border-bottom:none; }
  .react-row .av{ width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:28px;flex:0 0 auto; }
  .react-row .info{ flex:1;font-size:13px; }
  .react-row .info .who{ color:var(--kin);font-size:12px; }
  .react-row .tm{ font-size:12px;color:var(--sub); }
  .friend{ display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;cursor:pointer; }
  .friend .av{ width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:28px; }
  .friend .nm{ font-size:14px;font-weight:600; }
  .friend .sk{ font-size:12px;color:var(--kin);margin-top:2px; }
  .friend .chev{ margin-left:auto;color:var(--sub); }
  .addbtn{ width:100%;padding:13px;border-radius:13px;border:1px dashed var(--line);background:transparent;color:var(--kin);font-size:13px;cursor:pointer;margin-top:2px; }

  /* ── プロフィール ── */
  .prof-top{ display:flex;align-items:center;gap:14px;margin-bottom:14px; }
  .avatar{ width:72px;height:72px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3340,#11141a);border:2px solid var(--kin);display:grid;place-items:center;font-size:32px;cursor:pointer; }
  .prof-info{ flex:1; }
  .prof-info .pname{ font-family:var(--serif);font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
  .prof-info .rank-badge{ font-size:12px;background:rgba(200,162,76,.18);border:1px solid var(--kin);color:var(--kin);padding:2px 9px;border-radius:9px;font-family:var(--sans); }
  .prof-info .pid{ font-size:12px;color:var(--sub);margin-top:3px; }
  .gear{ width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;font-size:18px;flex:0 0 auto; }
  .stat3{ display:flex;gap:10px;margin-bottom:6px; }
  .stat{ flex:1;text-align:center;padding:13px 6px;border-radius:13px;background:var(--glass);border:1px solid var(--line); }
  .stat b{ display:block;font-family:var(--serif);font-size:21px;color:var(--kin); }
  .stat small{ font-size:12px;color:var(--sub);letter-spacing:.08em; }

  /* ── タブバー ── */
  .tabbar{ position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(10,12,16,.86);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20; }
  .tab{ flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;color:var(--sub); }
  .tab svg{ width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6; }
  .tab span{ font-size:10px;letter-spacing:.02em; }
  .tab.on{ color:var(--kin); }

  /* ── シート/モーダル ── */
  .ovl{ position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s; }
  .ovl.center{ align-items:center; }
  .sheet{ width:100%;max-width:460px;background:#15181f;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease;max-height:85vh;overflow-y:auto; }
  .sheet.card-c{ border-radius:18px;margin:0 16px;max-height:80vh; }
  @keyframes up{ from{transform:translateY(30px);opacity:.5;}to{transform:none;opacity:1;} }
  .sheet h3{ font-family:var(--serif);font-size:17px;margin:0 0 4px; }
  .sheet p.sub{ font-size:12px;color:var(--sub);margin:0 0 8px; }
  .sheet label{ display:block;font-size:12px;color:var(--sub);margin:14px 0 5px; }
  .sheet input[type=text],.sheet input[type=number]{ width:100%;background:var(--sumi2);border:1px solid var(--line);border-radius:9px;color:var(--washi);padding:11px;font-size:16px; }
  .sheet input[type=range]{ width:100%;accent-color:var(--kin); }
  .seg{ display:flex;gap:8px; }
  .seg button{ flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--washi);font-size:14px;cursor:pointer; }
  .seg button.sel{ background:rgba(200,162,76,.16);border-color:var(--kin);color:var(--kin); }
  .btnprime{ width:100%;margin-top:16px;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--kin),var(--kin2));color:#1a1407;font-weight:700;font-size:15px;cursor:pointer; }
  .btnghost{ width:100%;margin-top:9px;padding:12px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--washi);font-size:14px;cursor:pointer; }
  .btndanger{ background:var(--shu);border-color:var(--shu);color:#fff; }

  /* フレンド比較 */
  .cmp{ display:flex;justify-content:space-around;margin:12px 0;text-align:center; }
  .cmp .side .val{ font-family:var(--serif);font-size:24px;color:var(--kin); }
  .cmp .side .lbl{ font-size:12px;color:var(--sub);margin-top:2px; }
  .cmp .vs{ font-size:13px;color:var(--sub);align-self:center; }
  .react-btns{ display:flex;gap:10px;margin-top:14px; }
  .react-btns button{ flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--washi);font-size:14px;cursor:pointer; }
  .react-btns button:active{ background:rgba(200,162,76,.2); }

  /* 指南 */
  #tut{ position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#0c0e12,#161210);display:none;flex-direction:column;padding:30px 22px calc(24px + env(safe-area-inset-bottom)); }
  #tut .skip{ position:absolute;top:18px;right:18px;color:var(--sub);font-size:13px;cursor:pointer; }
  #tut .stage{ flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px; }
  #tut .big{ font-size:60px; }
  #tut .tt{ font-family:var(--serif);font-size:24px;letter-spacing:.08em; }
  #tut .tx{ font-size:14px;color:var(--sub);line-height:1.7;max-width:300px; }
  #tut .speech{ background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;max-width:300px; }
  #tut .dots{ display:flex;gap:7px;justify-content:center;margin-bottom:16px; }
  #tut .dots i{ width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2); }
  #tut .dots i.on{ background:var(--kin);width:18px;border-radius:4px; }
  .warn{ font-size:12px;color:var(--shu);margin:4px 0 0; }
  /* カレンダー */
  .cal{ border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:14px; }
  .cal-nav{ display:flex;justify-content:space-between;align-items:center;margin-bottom:12px; }
  .cal-nav button{ width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--glass);color:var(--washi);font-size:16px;cursor:pointer; }
  .cal-nav .month{ font-family:var(--serif);font-size:15px;color:var(--kin); }
  .cal-grid{ display:grid;grid-template-columns:repeat(7,1fr);gap:4px; }
  .cal-day-label{ text-align:center;font-size:12px;color:var(--sub);padding-bottom:4px; }
  .cal-day{ aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:12px; }
  .cal-day.done{ background:rgba(181,70,46,.7);color:#fff; }
  .cal-day.rest{ background:rgba(255,182,193,.25);color:#ffb6c1; }
  .cal-day.none{ background:rgba(110,147,166,.2);color:#6E93A6; }
  .cal-day.empty{ background:transparent; }
  .cal-day.today{ outline:1px solid var(--kin); }
  .cal-legend{ display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:12px;color:var(--sub); }
  .cal-legend span{ display:flex;align-items:center;gap:4px; }
  .cal-legend i{ width:10px;height:10px;border-radius:3px;display:inline-block; }
</style>
</head>
<body>
<div id="app">
  <div id="bg">
    <div class="bgimg t1" id="bgImg"></div>
    <div class="vig"></div>
  </div>
  <div id="main"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div id="xpPop"><div class="xpnum" id="xpNum"></div><div class="xplabel">練度上昇！</div></div>
<div id="tut">
  <div class="skip" onclick="closeTut()">省略</div>
  <div class="stage" id="tutStage"></div>
  <div class="dots" id="tutDots"></div>
  <button class="btnprime" id="tutNext" onclick="tutNext()">進む</button>
</div>
<script>
/* ══ マスターデータ ══ */
const RANKS=[
  {min:6,name:'門前払い'},{min:14,name:'入門'},{min:22,name:'修行僧'},{min:31,name:'鍛錬者'},
  {min:40,name:'求道者'},{min:49,name:'武練士'},{min:58,name:'道師'},{min:67,name:'達人'},
  {min:75,name:'仙人'},{min:84,name:'覚者'}
];
function rankOf(s){ let r=RANKS[0]; for(const x of RANKS){ if(s>=x.min)r=x; } return r; }
