<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鍛錬寺 Big6</title>
<style>
  :root{
    --bg:#0d0f14; --card:#181b22; --line:#252932; --txt:#eceef3; --sub:#8a93a8;
    --accent:#c8882a; --good:#46c178; --danger:#c0473a;
    --gold:#d4a843; --gold2:#f0c96a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }

  /* ===== LOGIN ===== */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:32px 24px;
    background:linear-gradient(170deg,#0d0f14 60%,#1a1208 100%);
  }
  .login-logo{ font-size:48px; margin-bottom:8px; }
  .login-title{ font-size:28px; font-weight:900; letter-spacing:.06em;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
  .login-sub{ color:var(--sub); font-size:13px; margin-bottom:48px; letter-spacing:.08em; }
  .login-btn{
    display:flex; align-items:center; gap:12px; background:#fff; color:#222;
    border:none; border-radius:14px; padding:14px 28px; font-size:16px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 24px rgba(0,0,0,.4); transition:transform .1s;
  }
  .login-btn:active{ transform:scale(.97); }
  .login-btn img{ width:22px; height:22px; }
  .login-note{ color:var(--sub); font-size:11px; margin-top:24px; text-align:center; line-height:1.6; }

  /* ===== APP ===== */
  #app{ display:none; min-height:100vh; }
  #view{
    padding:14px 14px 72px;
    min-height:100vh;
    background-attachment:fixed;
  }
  /* 背景画像：画面タイプごとに切り替え */
  #view.bg-top{
    background-image:linear-gradient(rgba(13,15,20,.82),rgba(13,15,20,.92)), url('images/t1.jpg');
    background-size:cover; background-position:center;
  }
  #view.bg-steps{
    background-image:linear-gradient(rgba(13,15,20,.78),rgba(13,15,20,.90)), url('images/t2.jpg');
    background-size:cover; background-position:center;
  }
  #view.bg-input{
    background-image:linear-gradient(rgba(13,15,20,.80),rgba(13,15,20,.92)), url('images/t3.jpg');
    background-size:cover; background-position:center;
  }

  /* ===== COMMON ===== */
  h1{ font-size:18px; font-weight:800; margin:0 0 10px; letter-spacing:.04em; }
  h3{ font-size:12px; color:var(--sub); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em; }
  .sub-txt{ color:var(--sub); font-size:12px; }

  /* ===== STREAK BAR ===== */
  .streak-bar{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(135deg,#1c1508,#201a0a);
    border:1px solid #3a2e10; border-radius:14px; padding:12px 16px; margin-bottom:14px;
  }
  .streak-flame{ font-size:26px; line-height:1; }
  .streak-info{ flex:1; }
  .streak-days{ font-size:16px; font-weight:800; color:var(--gold); }
  .streak-rest{ font-size:11px; color:var(--sub); margin-top:2px; }
  .streak-rest.ok{ color:var(--good); }
  .streak-rest.done{ color:var(--sub); }

  /* ===== BIG6 CARDS ===== */
  .grid{ display:flex; flex-direction:column; gap:10px; }
  .ex-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; cursor:pointer; transition:transform .06s, border-color .15s;
    position:relative; overflow:hidden;
  }
  .ex-card:active{ transform:scale(.985); }
  .ex-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); border-radius:3px 0 0 3px; opacity:0;
    transition:opacity .2s;
  }
  .ex-card.active-card::before{ opacity:1; }
  .ex-card .ex-num{ font-size:10px; color:var(--sub); letter-spacing:.08em; margin-bottom:2px; }
  .ex-card .ex-name{ font-size:17px; font-weight:800; }
  .ex-card .ex-mus{ color:var(--sub); font-size:11px; margin-left:6px; font-weight:400; }
  .ex-card .ex-step{ color:var(--accent); font-size:13px; margin-top:6px; }
  .ex-card .ex-prog{
    height:3px; background:var(--line); border-radius:2px; margin-top:10px;
  }
  .ex-card .ex-prog-fill{
    height:100%; border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    transition:width .4s ease;
  }

  /* ===== STEP LIST ===== */
  .stepwrap{ display:flex; flex-direction:column; gap:10px; padding:50vh 0; }
  .srow{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    cursor:pointer; transition:all .18s ease;
  }
  .srow .stxt{ flex:1; min-width:0; }
  .srow .sn{ font-size:11px; color:var(--sub); letter-spacing:.06em; }
  .srow .snm{ font-size:15px; font-weight:700; margin-top:2px; }
  .srow .stgt{ font-size:12px; color:var(--accent); margin-top:3px; }
  .srow .thumb{
    width:64px; height:64px; flex:0 0 auto; border-radius:10px;
    background:var(--bg) center/cover no-repeat; border:1px solid var(--line);
    transition:all .18s ease; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:11px;
  }
  .badge-cur{
    background:var(--accent); color:#fff; font-size:10px; padding:1px 7px;
    border-radius:10px; margin-left:6px;
  }
  .srow.lg{ border-color:var(--accent); }
  .srow.lg .thumb{ width:108px; height:108px; }
  .srow.lg .snm{ font-size:18px; }
  .srow.md{ opacity:.9; }
  .srow.md .thumb{ width:64px; height:64px; }
  .srow.sm{ opacity:.5; }
  .srow.sm .thumb{ width:42px; height:42px; border-radius:8px; }
  .srow.sm .snm{ font-size:13px; }
  .srow.sm .stgt{ display:none; }

  /* ===== INPUT SCREEN ===== */
  .top-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .back-btn{
    background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer;
    max-width:65%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .step-title{ text-align:center; font-size:18px; font-weight:800; margin:2px 0 4px; }
  .step-hint{ text-align:center; color:var(--sub); font-size:11px; margin-bottom:12px; }
  .ex-img{ width:100%; border-radius:14px; display:none; margin-bottom:12px; object-fit:cover; max-height:220px; }
  .no-img{
    display:none; text-align:center; color:var(--sub); font-size:12px;
    border:1px dashed var(--line); border-radius:14px; padding:22px; margin-bottom:12px;
  }

  /* STANDARDS */
  .stds{ display:flex; gap:8px; margin-bottom:14px; }
  .std{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 6px; text-align:center; cursor:pointer; transition:all .12s;
    -webkit-user-select:none; user-select:none;
  }
  .std:active{ transform:scale(.96); }
  .std .sl{ font-size:10px; color:var(--sub); letter-spacing:.06em; }
  .std .sv{ font-size:15px; font-weight:800; margin-top:3px; }
  .std.sel{ background:rgba(200,136,42,.15); border-color:var(--accent); }
  .std.sel .sl{ color:var(--accent); }

  /* FORM */
  .form-box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .form-row{ display:flex; gap:10px; margin-bottom:10px; }
  .form-row label{ flex:1; font-size:12px; color:var(--sub); }
  .form-row input{
    width:100%; margin-top:5px; background:var(--bg); border:1px solid var(--line);
    border-radius:9px; color:var(--txt); padding:11px; font-size:17px; outline:none;
    transition:border-color .15s;
  }
  .form-row input:focus{ border-color:var(--accent); }
  .form-row.note-row label{ display:block; }
  .save-btn{
    width:100%; background:linear-gradient(135deg,var(--accent),var(--gold));
    border:none; color:#fff; font-size:16px; font-weight:800;
    padding:14px; border-radius:11px; cursor:pointer; letter-spacing:.04em;
    transition:opacity .15s;
  }
  .save-btn:disabled{ background:var(--line); color:var(--sub); cursor:default; }

  /* LOGS */
  .log{
    padding:10px 2px; border-bottom:1px solid var(--line);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .log .lr{ display:flex; justify-content:space-between; font-size:14px; align-items:center; }
  .log .ld{ color:var(--sub); }
  .log .lv{ font-weight:800; }
  .log .ln{ font-size:12px; color:var(--sub); margin-top:4px; line-height:1.5; }
  .itag{
    font-size:10px; padding:2px 7px; border-radius:8px; margin-left:6px;
    color:#06210f; font-weight:700; vertical-align:middle;
  }

  /* CHART */
  .chartbox{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px 4px; margin-top:6px;
  }
  .legend{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin:6px 0 2px; font-size:11px; color:var(--sub);
  }
  .legend i{
    display:inline-block; width:12px; height:3px; border-radius:2px;
    margin-right:4px; vertical-align:middle;
  }

  /* MODAL */
  .ovl{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:var(--card); border:1px solid var(--line);
    border-radius:20px 20px 0 0; width:100%; max-width:520px;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-h{ font-weight:800; font-size:16px; margin-bottom:6px; }
  .sheet label{ display:block; font-size:12px; color:var(--sub); margin:12px 0 0; }
  .sheet input,.sheet select{
    width:100%; margin-top:5px; background:var(--bg); border:1px solid var(--line);
    border-radius:9px; color:var(--txt); padding:11px; font-size:16px;
  }
  .sheet .sheet-rows{ display:flex; gap:10px; }
  .sheet .sheet-rows label{ flex:1; }
  .sheet-btn{
    width:100%; margin-top:11px; padding:13px; border-radius:11px;
    border:none; font-weight:800; font-size:15px; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--gold)); color:#fff;
  }
  .sheet-btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--txt); }
  .sheet-btn.danger{ background:var(--danger); }
  .sheet-btn:disabled{ opacity:.5; }

  /* TOAST */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--good); color:#06210f; padding:11px 20px; border-radius:22px;
    font-size:14px; font-weight:800; opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
</style>
</head>

const FREE = {k:'', label:'自由', color:'#8a93a8'};
function serOf(key){ return SER.find(s=>s.k===key) || FREE; }

let STEPS = {};   // {exKey: currentStep}
let _cur = {k:null, n:null};
let _selStd = null;
let _saving = false;

let _rows = [], _ticking = false;
let _streakData = {streak:0, trainedToday:false, restRemaining:3};

function exOf(k){ return MASTER.find(e=>e.key===k); }
function stepObj(k,n){ return exOf(k).steps[n-1]; }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function targetReps(p){
  var a=String(p).split('×'); if(a.length<2) return null;
  var v=parseInt(a[1],10); return isNaN(v)?null:v;
}

/* ===== FIRESTORE HELPERS ===== */
function userDoc(){ return db.collection('users').doc(uid); }
function logsCol(){ return userDoc().collection('logs'); }

async function loadProfile(){
  const snap = await userDoc().get();
  if(snap.exists){
    const d = snap.data();
    STEPS = d.currentSteps || {};
    _streakData = d.streakData || {streak:0, trainedToday:false, restRemaining:3};
  }
  MASTER.forEach(e=>{ if(!STEPS[e.key]) STEPS[e.key]=1; });
}

async function saveProfile(){
  await userDoc().set({ currentSteps: STEPS }, { merge: true });
}

async function saveLog(p){
  const ref = logsCol().doc();
  await ref.set({
    id: ref.id,
    exKey: p.exKey, exName: p.exName,
    step: p.step, stepName: p.stepName,
    sets: p.sets, reps: p.reps,
    note: p.note || '', intensity: p.intensity || '',
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    ts: Date.now()
  });
  STEPS[p.exKey] = p.step;
  await saveProfile();
  return await getStepData(p.exKey, p.step);
}

async function getStepData(exKey, step){
  const snap = await logsCol()
    .where('exKey','==',exKey)
    .where('step','==',step)
    .orderBy('ts','asc')
    .get();
  return snap.docs.map(d=>{
    const v=d.data();
    const dt = v.ts ? new Date(v.ts) : new Date();
    const ds = (dt.getMonth()+1)+'/'+(dt.getDate());
    return { id:d.id, date:ds, ymd:fmtYmd(dt),
      sets:v.sets, reps:v.reps, note:v.note||'', intensity:v.intensity||'' };
  });
}

function fmtYmd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function deleteLog(id, exKey, step){
  await logsCol().doc(id).delete();
  return await getStepData(exKey, step);
}

async function updateLog(f){
  const upd = {
    sets: f.sets, reps: f.reps, note: f.note||'', intensity: f.intensity||''
  };
  if(f.ymd){
    const pa = f.ymd.split('-');
    const d = new Date(+pa[0],+pa[1]-1,+pa[2],12,0,0);
    upd.ts = d.getTime();
  }
  await logsCol().doc(f.id).update(upd);
  return await getStepData(f.exKey, f.step);
}

async function calcStreak(){
  const snap = await logsCol().orderBy('ts','asc').get();
  const trainedDates = new Set();
  snap.docs.forEach(d=>{
    const v=d.data();
    if(v.ts){ const dt=new Date(v.ts); trainedDates.add(fmtYmd(dt)); }
  });
  const today = new Date();
  const todayStr = fmtYmd(today);
  const trainedToday = trainedDates.has(todayStr);

  function isoWeek(dt){
    const tmp=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
    const dow=tmp.getUTCDay()||7;
    tmp.setUTCDate(tmp.getUTCDate()+4-dow);
    const y=tmp.getUTCFullYear();
    const w=Math.ceil(((tmp-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
    return y+'W'+w;
  }

  // 週の最大休養日は3日（= 週最低4日）← ここを変数化しておく
  const MAX_REST = 3;
  let streak=0, restByWeek={};
  const check=new Date(today);
  if(!trainedToday) check.setDate(check.getDate()-1);
  for(let i=0;i<730;i++){
    const ds=fmtYmd(check), wk=isoWeek(check);
    if(!restByWeek[wk]) restByWeek[wk]=0;
    if(trainedDates.has(ds)){ streak++; }
    else {
      if(restByWeek[wk]<MAX_REST){ restByWeek[wk]++; streak++; }
      else break;
    }
    check.setDate(check.getDate()-1);
  }

  const thisWk=isoWeek(today);
  const restUsed=restByWeek[thisWk]||0;
  const restRemaining=Math.max(0,MAX_REST-restUsed);
  return {streak, trainedToday, restRemaining};
}

/* ===== HISTORY ===== */
const _hist=[];
function pushHist(state){ _hist.push(state); }
function goBack(){
  _hist.pop();
  const prev=_hist[_hist.length-1];
  if(!prev){ renderDash(); return; }
  if(prev.v==='steps') openSteps(prev.k);
  else if(prev.v==='input') openInput(prev.k,prev.n);
  else renderDash();
}

function goSteps(k){ pushHist({v:'steps',k}); openSteps(k); }
function goInput(k,n){ pushHist({v:'input',k,n}); openInput(k,n); }
window.addEventListener('popstate',()=>{ goBack(); });

/* ===== LEVEL 2: STEP LIST ===== */
function openSteps(k){
  window.onscroll=null; _rows=[];
  document.getElementById('view').className='bg-steps';
  const e=exOf(k), cur=STEPS[k]||1;
  let h=`<div class="top-nav">
    <button class="back-btn" onclick="goBack()">← トップ</button>
    <div><div style="font-weight:800">${esc(e.name)}</div>
    <div class="sub-txt">${esc(e.muscle)}</div></div></div>
  <div class="stepwrap" id="stepwrap">`;
  e.steps.forEach(s=>{
    const isc=s.n===cur;
    h+=`<div class="srow" data-iscur="${isc?1:0}" onclick="goInput('${k}',${s.n})">
      <div class="stxt">
        <div class="sn">STEP ${s.n}${isc?'<span class="badge-cur">現在</span>':''}</div>
        <div class="snm">${esc(s.name)}</div>
        <div class="stgt">上級基準 ${esc(s.p)}</div>
      </div>
      <div class="thumb" id="thumb_${s.n}"><span>${s.n}</span></div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('view').innerHTML=h;

  // サムネ画像読み込み（画像ファイルが存在する場合のみ表示）
  e.steps.forEach(s=>{
    const img=new Image();
    const src=`images/${e.num}-${s.n}.jpg`;
    img.onload=()=>{
      const t=document.getElementById('thumb_'+s.n);
      if(t){ t.style.backgroundImage=`url(${src})`; t.innerHTML=''; }
    };
    img.src=src;
  });

  _rows=Array.from(document.querySelectorAll('.srow'));
  window.onscroll=()=>{ if(!_ticking){ _ticking=true; requestAnimationFrame(()=>{ applyFocus(); _ticking=false; }); }};

  // 現在ステップを中央へ
  const ci=(STEPS[k]||1)-1, cel=_rows[ci];
  if(cel){ const cr=cel.getBoundingClientRect();
    window.scrollTo(0,Math.max(0,window.scrollY+cr.top+cr.height/2-window.innerHeight/2)); }
  applyFocus();
}

function applyFocus(){
  if(!_rows.length) return;
  const vc=window.innerHeight/2; let best=0,bd=1e9;
  _rows.forEach((r,i)=>{ const c=r.getBoundingClientRect(),cy=c.top+c.height/2,d=Math.abs(cy-vc); if(d<bd){bd=d;best=i;} });
  _rows.forEach((r,j)=>{
    const dist=Math.abs(j-best);
    r.className='srow '+(dist===0?'lg':dist===1?'md':'sm');
  });
}

function fillStd(el,key,val){
  const all=el.parentNode.querySelectorAll('.std');
  const already=el.classList.contains('sel');
  all.forEach(a=>a.classList.remove('sel'));
  if(already){ _selStd=null; document.getElementById('inSets').value=''; document.getElementById('inReps').value=''; return; }
  el.classList.add('sel'); _selStd=key;
  let sets=1,reps=0;
  const sp=String(val).split('×');
  if(sp.length>=2){ sets=parseInt(sp[0],10)||1; reps=parseInt(sp[1],10)||0; }
  else {
    const mm=String(val).match(/(\d+)分/), ss=String(val).match(/(\d+)秒/);
    if(mm) reps=(parseInt(mm[1],10)||0)*60;
    else if(ss) reps=parseInt(ss[1],10)||0;
  }
  document.getElementById('inSets').value=sets;
  document.getElementById('inReps').value=reps;
}

function renderStepData(data){
  _records=data||[];
  const listEl=document.getElementById('logList'), chartEl=document.getElementById('chartArea');
  if(!listEl) return;
  if(!data||!data.length){
    listEl.innerHTML='<div class="sub-txt">まだ記録がありません</div>';
    chartEl.innerHTML='<div class="sub-txt" style="padding:18px;text-align:center">記録がたまるとグラフが出ます</div>';
    return;
  }
  const rev=data.slice().reverse(); let h='';
  rev.slice(0,10).forEach(g=>{
    const so=serOf(g.intensity);
    h+=`<div class="log" data-id="${g.id}">
      <div class="lr">
        <span class="ld">${esc(g.date)}<span class="itag" style="background:${so.color}">${so.label}</span></span>
        <span class="lv">${esc(g.sets)}×${esc(g.reps)}</span>
      </div>${g.note?'<div class="ln">📝 '+esc(g.note)+'</div>':''}
    </div>`;
  });
  listEl.innerHTML=h;
  bindLongPress();
  const st=stepObj(_cur.k,_cur.n);
  chartEl.innerHTML=lineChart(data,{b:targetReps(st.b),i:targetReps(st.i),p:targetReps(st.p)});
}

async function doSave(){
  if(_saving) return;
  const k=_cur.k, n=_cur.n;
  const sets=parseInt(document.getElementById('inSets').value,10)||0;
  const reps=parseInt(document.getElementById('inReps').value,10)||0;
  if(reps<=0){ toast('回数（秒）を入れてね'); return; }
  const btn=document.getElementById('saveBtn');
  _saving=true; if(btn){btn.disabled=true;btn.textContent='記録中…';}
  try{
    const prevBest = _records.length ? Math.max(..._records.map(r=>Number(r.reps)||0)) : 0;
    const s=stepObj(k,n);
    const data=await saveLog({exKey:k,exName:exOf(k).name,step:n,stepName:s.name,
      sets:Math.max(1,sets),reps,note:document.getElementById('inNote').value,intensity:_selStd||''});
    renderStepData(data);
    document.getElementById('inReps').value='';
    document.getElementById('inNote').value='';
    if(reps > prevBest && prevBest > 0){ playSound('sound_newrecord'); }
    else { playSound('sound_record'); }
    toast('記録しました');
    calcStreak().then(d=>{_streakData=d;});
  }catch(e){ toast('保存に失敗しました'); }
  finally{ _saving=false; if(btn){btn.disabled=false;btn.textContent='記録する';} }
}

/* ===== LONG PRESS ===== */
function bindLongPress(){
  document.querySelectorAll('#logList .log').forEach(el=>{
    let timer=null;
    const start=()=>{ timer=setTimeout(()=>openRecordMenu(el.dataset.id),500); };
    const cancel=()=>{ if(timer){clearTimeout(timer);timer=null;} };
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',cancel);
    el.addEventListener('touchmove',cancel,{passive:true});
    el.addEventListener('touchcancel',cancel);
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',cancel);
    el.addEventListener('mouseleave',cancel);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

/* ===== LINE CHART ===== */
function lineChart(records, targets){
  const W=320,H=152,pl=30,pr=14,pt=14,pb=28;
  const n=records.length;
  const tv=[]; if(targets){ Object.values(targets).forEach(v=>{if(v)tv.push(v);}); }
  const allVals=records.map(r=>Number(r.reps)||0);
  let maxV=Math.max(...allVals,...tv); if(maxV<=0) maxV=1;
  const X=i=>n===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*i/(n-1);
  const Y=v=>pt+(H-pt-pb)*(1-v/maxV);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
  s+=`<line x1="${pl}" y1="${Y(0)}" x2="${W-pr}" y2="${Y(0)}" stroke="#252932"/>`;
  s+=`<text x="${pl-4}" y="${pt+4}" fill="#8a93a8" font-size="9" text-anchor="end">${maxV}</text>`;
  s+=`<text x="${pl-4}" y="${Y(0)}" fill="#8a93a8" font-size="9" text-anchor="end">0</text>`;
  const present={};
  function drawSeries(key,color,tgt){
    const pts=records.map((r,i)=>(r.intensity||'')==key?{x:X(i),y:Y(Number(r.reps)||0)}:null).filter(Boolean);
    if(!pts.length) return; present[key]=true;
    if(tgt){ const ty=Y(tgt).toFixed(1);
      s+=`<line x1="${pl}" y1="${ty}" x2="${W-pr}" y2="${ty}" stroke="${color}" stroke-dasharray="3 4" stroke-width="1" opacity="0.4"/>`; }
    if(pts.length>1) s+=`<polyline points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>`;
    s+=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"/>`).join('');
  }
  SER.forEach(se=>drawSeries(se.k,se.color,targets?targets[se.k]:null));
  drawSeries('',FREE.color,null);
  if(n){ s+=`<text x="${X(0)}" y="${H-6}" fill="#8a93a8" font-size="9" text-anchor="start">${esc(records[0].date)}</text>`; }
  if(n>1){ s+=`<text x="${X(n-1)}" y="${H-6}" fill="#8a93a8" font-size="9" text-anchor="end">${esc(records[n-1].date)}</text>`; }
  s+='</svg>';
  const leg='<div class="legend">'+SER.filter(se=>present[se.k]).map(se=>`<span><i style="background:${se.color}"></i>${se.label}</span>`).join('')+(present['']?`<span><i style="background:${FREE.color}"></i>${FREE.label}</span>`:'')+  '</div>';
  return s+leg;
}

/* ===== SOUND MANAGER ===== */
const SND = {};
const MAX_SND_SEC = 14; // 長い音声ファイルも最大14秒で止める
function playSound(name){
  try{
    if(!SND[name]){
      const a = new Audio(`sounds/${name}.mp3`);
      a.preload='auto'; SND[name]=a;
    }
    const a = SND[name];
    a.currentTime=0; a.play().catch(()=>{});
    // 禊系など長いファイルは自動で止める
    setTimeout(()=>{ try{ a.pause(); a.currentTime=0; }catch(e){} }, MAX_SND_SEC*1000);
  }catch(e){}
}
// タップ音：ボタン押下時に共通で鳴らす
document.addEventListener('click', e=>{
  if(e.target.matches('button, .ex-card, .srow, .std')){
    playSound('sound_tap');
  }
});

/* ===== TOAST ===== */
let _tt;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
