<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鍛錬寺 Big6 — 骨格プロトタイプ</title>
<style>
  :root{
    --sumi:#0c0e12;        /* 墨・地 */
    --sumi2:#13161c;       /* 一段明るい地 */
    --washi:#ECE6D8;       /* 和紙・文字 */
    --sub:#8b8f99;         /* 補助文字 */
    --kin:#C8A24C;         /* 金 */
    --kin-bright:#E6C97C;  /* 明るい金 */
    --shu:#B5462E;         /* 朱 */
    --ai:#6E93A6;          /* 藍（フレンド） */
    --line:rgba(200,162,76,.16);
    --glass:rgba(236,230,216,.045);
    --glass-2:rgba(236,230,216,.08);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--sans); color:var(--washi); background:#000;
    display:flex; justify-content:center;
  }
  /* アプリ枠（スマホ幅。PCでは中央寄せ） */
  #app{
    position:relative; width:100%; max-width:460px; min-height:100vh;
    background:var(--sumi); isolation:isolate;
  }
  /* 背景演出（固定して背景が流れないようにする） */
  #bg{ position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; height:100vh; z-index:0; pointer-events:none; overflow:hidden; }
  #bg .blot{ position:absolute; border-radius:50%; filter:blur(40px); opacity:.5; }
  #bg .b1{ width:280px;height:280px; top:-60px; left:-80px; background:radial-gradient(circle,#1b2330,transparent 70%); }
  #bg .b2{ width:320px;height:320px; bottom:120px; right:-120px; background:radial-gradient(circle,#241d12,transparent 70%); }
  #bg .vig{ position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 30%, transparent 40%, rgba(0,0,0,.55) 100%); }
  #bg svg{ position:absolute; }
  .enso{ top:14%; left:50%; transform:translateX(-50%); width:360px; height:360px; opacity:.10; }
  .mtn{ bottom:0; left:0; width:100%; opacity:.5; }

  /* 画面本体 */
  #main{ position:relative; z-index:1; padding:14px 14px 150px; min-height:100vh; }
  .scr{ animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ヘッダー */
  .brand{ display:flex; align-items:center; justify-content:space-between; margin:6px 2px 14px; }
  .brand .logo{ font-family:var(--serif); font-size:22px; letter-spacing:.14em; color:var(--washi); }
  .brand .logo b{ color:var(--kin); font-weight:600; }
  .brand .logo small{ font-family:var(--sans); font-size:11px; letter-spacing:.2em; color:var(--sub); margin-left:8px; }
  .bell{ position:relative; width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
         display:flex; align-items:center; justify-content:center; background:var(--glass); cursor:pointer; }
  .bell .dot{ position:absolute; top:7px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--shu); }

  /* 見出し（金の筆線つき） */
  .h{ font-family:var(--serif); font-size:15px; letter-spacing:.12em; margin:18px 2px 10px; color:var(--washi);
      display:inline-block; position:relative; }
  .h::after{ content:""; display:block; height:2px; margin-top:5px; border-radius:2px;
      background:linear-gradient(90deg,var(--kin),transparent); }

  /* 帯（ストリーク） */
  .streak{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px;
           background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(6px); margin-bottom:12px; }
  .streak .fire{ font-size:26px; line-height:1; filter:drop-shadow(0 0 6px rgba(181,70,46,.5)); }
  .streak .txt{ flex:1; }
  .streak .d{ font-family:var(--serif); font-size:17px; color:var(--washi); }
  .streak .r{ font-size:11px; color:var(--kin); margin-top:2px; }
  .restbtn{ padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:transparent;
            color:var(--washi); font-size:12px; font-family:var(--sans); cursor:pointer; white-space:nowrap; }

  /* XPバー */
  .xp{ padding:12px 16px; border-radius:14px; background:var(--glass); border:1px solid var(--line); margin-bottom:6px; }
  .xp .row{ display:flex; justify-content:space-between; font-size:11px; color:var(--sub); margin-bottom:6px; }
  .xp .row b{ color:var(--kin); font-family:var(--serif); font-size:13px; }
  .bar{ height:7px; border-radius:6px; background:rgba(255,255,255,.07); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--kin),var(--kin-bright)); }

  /* 種目カード（六大修行） */
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .card{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px;
         background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(6px); cursor:pointer;
         transition:transform .07s, border-color .2s; }
  .card:active{ transform:scale(.99); }
  .card .ic{ width:46px; height:46px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center;
             font-family:var(--serif); font-size:20px; color:var(--washi); background:rgba(255,255,255,.05);
             border:1px solid var(--line); }
  .card .body{ flex:1; min-width:0; }
  .card .nm{ font-size:15px; font-weight:600; }
  .card .st{ font-size:12px; color:var(--kin); margin-top:3px; }
  .card .meta{ font-size:11px; color:var(--sub); margin-top:2px; }
  .card .prog{ width:42px; text-align:center; }
  .card .chev{ color:var(--sub); font-size:20px; margin-left:6px; }
  .card .prog b{ font-family:var(--serif); font-size:20px; color:var(--kin); }
  .card .prog small{ display:block; font-size:9px; color:var(--sub); letter-spacing:.1em; }
  /* 状態 */
  .card.done .ic{ background:linear-gradient(135deg,rgba(200,162,76,.3),rgba(200,162,76,.08));
                  border-color:var(--kin); color:var(--kin-bright); }
  .card.done .prog b{ color:var(--kin-bright); }
  .card.idle{ opacity:.6; }
  .card.idle .st{ color:var(--sub); }

  /* 戻りヘッダー */
  .top{ display:flex; align-items:center; gap:10px; margin:4px 0 12px; }
  .back{ width:40px; height:40px; flex:0 0 auto; border-radius:12px; border:1px solid var(--line);
         background:var(--glass); color:var(--washi); display:grid; place-items:center; cursor:pointer; font-size:18px; }
  .top .ttl{ font-family:var(--serif); font-size:17px; letter-spacing:.06em; }
  .top .ttl small{ display:block; font-family:var(--sans); font-size:11px; color:var(--sub); letter-spacing:.1em; margin-top:1px; }

  /* 10ステップ一覧 */
  #steplist{ display:flex; flex-direction:column; gap:10px; padding-bottom:200px; }
  .srow{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
         background:var(--glass); border:1px solid var(--line); cursor:pointer; transition:border-color .15s, background .15s; }
  .srow.current{ border-color:var(--kin); background:var(--glass-2); }
  .srow.current .nm{ font-size:17px; }
  .srow.current .th{ width:82px; height:82px; }
  .srow .txt{ flex:1; min-width:0; }
  .srow .n{ font-size:11px; color:var(--sub); letter-spacing:.08em; }
  .srow .nm{ font-size:14px; font-weight:600; margin-top:2px; }
  .srow .th{ width:54px; height:54px; flex:0 0 auto; border-radius:10px; border:1px solid var(--line);
             background:rgba(255,255,255,.04); display:grid; place-items:center; font-size:10px; color:var(--sub);
             transition:width .15s, height .15s; }
  .badge{ font-size:9px; background:var(--kin); color:#1a1407; padding:1px 7px; border-radius:9px; margin-left:6px; font-weight:700; }
  @keyframes flash{ 0%{background:rgba(200,162,76,.0);} 40%{background:rgba(200,162,76,.32);} 100%{background:rgba(200,162,76,.0);} }
  .srow.flash{ animation:flash .35s ease; }
  .card.flash{ animation:flash .35s ease; }
  .relic.flash{ animation:flash .35s ease; }
  .friend.flash{ animation:flash .35s ease; }
  .rankcard.flash{ animation:flash .35s ease; }
  .lvbtn.flash{ animation:flash .35s ease; }

  /* 記録画面 */
  .memo-prev{ border:1px solid var(--line); border-radius:12px; background:var(--glass); padding:10px 13px; margin-bottom:10px; }
  .memo-prev .lbl{ font-size:11px; color:var(--kin); cursor:pointer; display:flex; justify-content:space-between; }
  .memo-prev .bd{ font-size:13px; color:var(--washi); margin-top:7px; line-height:1.5; }
  .recgrid{ display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; }
  .recimg{ width:96px; height:96px; flex:0 0 auto; border-radius:12px; border:1px solid var(--line);
           background:rgba(255,255,255,.04); display:grid; place-items:center; gap:2px; cursor:pointer; position:relative; }
  .recimg .ph{ font-size:11px; color:var(--sub); }
  .recimg .tap{ position:absolute; bottom:5px; right:6px; font-size:9px; color:var(--kin); }
  .recmeta{ flex:1; min-width:0; }
  .recmeta .nm{ font-family:var(--serif); font-size:16px; }
  .recmeta .sn{ font-size:11px; color:var(--sub); margin-top:2px; }
  .stds{ display:flex; gap:7px; margin-top:9px; }
  .std{ flex:1; text-align:center; padding:7px 3px; border-radius:9px; border:1px solid var(--line);
        background:rgba(255,255,255,.03); cursor:pointer; transition:all .12s; }
  .std .l{ font-size:9px; color:var(--sub); }
  .std .v{ font-size:13px; font-weight:700; margin-top:2px; }
  .std.sel{ background:rgba(200,162,76,.16); border-color:var(--kin); }
  .std.sel .l{ color:var(--kin); }
  .inrow{ display:flex; gap:8px; align-items:flex-end; margin-bottom:9px; }
  .inrow .f{ flex:1; }
  .inrow .f label{ font-size:10px; color:var(--sub); display:block; margin-bottom:4px; }
  .inrow input{ width:100%; background:var(--sumi2); border:1px solid var(--line); border-radius:9px;
                color:var(--washi); padding:11px 10px; font-size:16px; font-family:var(--sans); }
  .recbtn{ flex:1.1; background:linear-gradient(135deg,var(--kin),var(--kin-bright)); color:#1a1407;
           border:none; border-radius:9px; padding:12px 6px; font-weight:700; font-size:14px; cursor:pointer; height:44px; }
  .memrow{ display:flex; gap:8px; margin-bottom:6px; }
  .memrow input{ flex:1; background:var(--sumi2); border:1px solid var(--line); border-radius:9px;
                 color:var(--washi); padding:11px 10px; font-size:15px; }
  .histbtn{ flex:0 0 auto; width:48px; border-radius:9px; border:1px solid var(--line); background:var(--glass);
            color:var(--kin); font-size:18px; cursor:pointer; }
  .divider{ height:1px; background:var(--line); margin:16px 0 6px; }

  /* グラフ枠 */
  .chartbox{ border:1px solid var(--line); border-radius:14px; background:var(--glass); padding:12px 10px 6px; }
  .legend{ display:flex; gap:14px; justify-content:center; font-size:11px; color:var(--sub); margin-top:6px; }
  .legend i{ display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .log{ padding:9px 2px; border-bottom:1px solid var(--line); }
  .log .lr{ display:flex; justify-content:space-between; font-size:13px; }
  .log .d{ color:var(--sub); }
  .log .r{ font-weight:700; }
  .itag{ font-size:9px; padding:1px 6px; border-radius:8px; margin-left:6px; color:#0c0c0c; font-weight:700; }
  .log .ln{ font-size:12px; color:var(--sub); margin-top:4px; }

  /* クエスト */
  .mission{ border:1px solid var(--line); border-radius:16px; background:var(--glass); padding:16px; margin-bottom:14px; }
  .mission .t{ font-family:var(--serif); font-size:16px; }
  .mission .lv{ display:flex; gap:8px; margin:12px 0; }
  .lvbtn{ flex:1; text-align:center; padding:9px 4px; border-radius:10px; border:1px solid var(--line);
          background:rgba(255,255,255,.03); font-size:12px; cursor:pointer; }
  .lvbtn.sel{ background:rgba(200,162,76,.16); border-color:var(--kin); color:var(--kin); }
  .mission .pr{ font-size:11px; color:var(--sub); margin-bottom:6px; display:flex; justify-content:space-between; }
  .relics{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .relic{ aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:var(--glass);
          display:grid; place-items:center; text-align:center; gap:3px; font-size:10px; color:var(--sub); }
  .relic .em{ font-size:24px; }
  .relic.locked{ opacity:.32; }
  .relic.got{ border-color:var(--kin); color:var(--washi); }
  .relic.got .em{ filter:drop-shadow(0 0 5px rgba(200,162,76,.5)); }

  /* メッセージ */
  .msg{ display:flex; gap:11px; padding:13px; border-radius:13px; background:var(--glass);
        border:1px solid var(--line); margin-bottom:9px; }
  .msg .av{ width:38px; height:38px; flex:0 0 auto; border-radius:50%; background:rgba(255,255,255,.06);
            border:1px solid var(--line); display:grid; place-items:center; font-family:var(--serif); }
  .msg .c{ flex:1; }
  .msg .who{ font-size:12px; color:var(--kin); }
  .msg .bd{ font-size:14px; margin-top:3px; line-height:1.4; }
  .msg .tm{ font-size:10px; color:var(--sub); margin-top:4px; }

  /* プロフィール */
  .prof-top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .avatar{ width:72px; height:72px; flex:0 0 auto; border-radius:50%;
           background:radial-gradient(circle at 35% 30%, #2a3340, #11141a); border:2px solid var(--kin);
           display:grid; place-items:center; font-family:var(--serif); font-size:26px; color:var(--kin-bright); }
  .prof-top .pn{ font-family:var(--serif); font-size:20px; }
  .prof-top .pid{ font-size:11px; color:var(--sub); margin-top:2px; }
  .prof-top .gear{ margin-left:auto; width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
                   background:var(--glass); display:grid; place-items:center; cursor:pointer; font-size:18px; }
  .stat3{ display:flex; gap:10px; margin-bottom:6px; }
  .stat{ flex:1; text-align:center; padding:13px 6px; border-radius:13px; background:var(--glass); border:1px solid var(--line); }
  .stat b{ display:block; font-family:var(--serif); font-size:21px; color:var(--kin); }
  .stat small{ font-size:10px; color:var(--sub); letter-spacing:.08em; }
  .rankcard{ text-align:center; padding:18px; border-radius:16px; background:var(--glass); border:1px solid var(--line);
             position:relative; overflow:hidden; }
  .rankcard .lab{ font-size:11px; color:var(--sub); letter-spacing:.2em; }
  .rankcard .nm{ font-family:var(--serif); font-size:30px; color:var(--kin-bright); margin-top:4px; letter-spacing:.1em; }
  .friend{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:13px;
           background:var(--glass); border:1px solid var(--line); margin-bottom:8px; cursor:pointer; }
  .friend .av{ width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.06);
               border:1px solid var(--line); display:grid; place-items:center; font-family:var(--serif); }
  .friend .nm{ font-size:14px; font-weight:600; }
  .friend .sk{ font-size:11px; color:var(--kin); margin-top:2px; }
  .friend .chev{ margin-left:auto; color:var(--sub); }
  .addbtn{ width:100%; padding:13px; border-radius:13px; border:1px dashed var(--line); background:transparent;
           color:var(--kin); font-size:13px; cursor:pointer; margin-top:2px; }

  /* タブバー */
  .tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
           display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
           background:rgba(10,12,16,.86); backdrop-filter:blur(12px); border-top:1px solid var(--line); z-index:20; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; cursor:pointer;
        color:var(--sub); }
  .tab svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6; }
  .tab span{ font-size:10px; letter-spacing:.05em; }
  .tab.on{ color:var(--kin); }
  .tab.on::after{ content:""; width:5px; height:5px; border-radius:50%; background:var(--kin); margin-top:1px; }

  /* シート/モーダル */
  .ovl{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:flex-end;
        justify-content:center; animation:fade .2s; }
  .ovl.center{ align-items:center; }
  .sheet{ width:100%; max-width:460px; background:#15181f; border:1px solid var(--line);
          border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .25s ease; }
  .sheet.card-c{ border-radius:18px; margin:0 16px; }
  @keyframes up{ from{ transform:translateY(30px); opacity:.5; } to{ transform:none; opacity:1; } }
  .sheet h3{ font-family:var(--serif); font-size:17px; margin:0 0 4px; }
  .sheet p.sub{ font-size:12px; color:var(--sub); margin:0 0 8px; }
  .sheet label{ display:block; font-size:12px; color:var(--sub); margin:14px 0 5px; }
  .sheet input[type=text], .sheet input[type=number]{ width:100%; background:var(--sumi2); border:1px solid var(--line);
        border-radius:9px; color:var(--washi); padding:11px; font-size:16px; }
  .sheet input[type=range]{ width:100%; accent-color:var(--kin); }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; padding:11px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03);
               color:var(--washi); font-size:14px; cursor:pointer; }
  .seg button.sel{ background:rgba(200,162,76,.16); border-color:var(--kin); color:var(--kin); }
  .btnprime{ width:100%; margin-top:16px; padding:13px; border:none; border-radius:11px;
             background:linear-gradient(135deg,var(--kin),var(--kin-bright)); color:#1a1407; font-weight:700; font-size:15px; cursor:pointer; }
  .btnghost{ width:100%; margin-top:9px; padding:12px; border:1px solid var(--line); border-radius:11px;
             background:transparent; color:var(--washi); font-size:14px; cursor:pointer; }
  .btndanger{ background:var(--shu); border-color:var(--shu); color:#fff; }
  .phrase{ padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.03);
           font-size:14px; margin-bottom:8px; cursor:pointer; }
  .phrase:active{ background:rgba(200,162,76,.14); }
  .phrase-cat{ font-size:11px; color:var(--kin); letter-spacing:.1em; margin:12px 2px 6px; font-family:var(--serif); }
  .imgpair{ display:flex; gap:10px; }
  .imgpair .one{ flex:1; aspect-ratio:4/3; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04);
                 display:grid; place-items:center; gap:4px; color:var(--sub); font-size:12px; transition:border-color .2s; }
  .imgpair .one.on{ border-color:var(--kin); color:var(--washi); }
  .imgcap{ font-size:11px; color:var(--sub); text-align:center; margin-top:10px; }

  /* チュートリアル */
  #tut{ position:fixed; inset:0; z-index:80; background:linear-gradient(180deg,#0c0e12,#161210);
        display:none; flex-direction:column; padding:30px 22px calc(24px + env(safe-area-inset-bottom)); }
  #tut .skip{ position:absolute; top:18px; right:18px; color:var(--sub); font-size:13px; cursor:pointer; }
  #tut .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
  #tut .big{ font-size:60px; }
  #tut .tt{ font-family:var(--serif); font-size:24px; letter-spacing:.08em; }
  #tut .tx{ font-size:14px; color:var(--sub); line-height:1.7; max-width:300px; }
  #tut .speech{ background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
                font-size:14px; line-height:1.6; max-width:300px; }
  #tut .dots{ display:flex; gap:7px; justify-content:center; margin-bottom:16px; }
  #tut .dots i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.2); }
  #tut .dots i.on{ background:var(--kin); width:18px; border-radius:4px; }
  .tut-note{ font-size:11px; color:var(--sub); text-align:center; margin:14px 2px 0; }

  .hint-strip{ font-size:11px; color:var(--sub); text-align:center; background:var(--glass); border:1px dashed var(--line);
               border-radius:10px; padding:8px; margin-bottom:12px; }
  .hint-strip b{ color:var(--kin); cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="bg">
    <div class="blot b1"></div><div class="blot b2"></div>
    <svg class="enso" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#C8A24C" stroke-width="2.4" stroke-dasharray="250 14" stroke-linecap="round" transform="rotate(-20 50 50)"/></svg>
    <svg class="mtn" viewBox="0 0 460 160" preserveAspectRatio="none">

/* ============ レーダー（六角形） ============ */
function radar(setsArr, colors){
  const W=240,H=220,cx=120,cy=112,R=82,MAX=10;
  const labels=EX.map(e=>e.kanji);
  const N=6;
  const ang=i=> (-90 + i*60) * Math.PI/180;
  const pt=(i,rad)=>[cx+rad*Math.cos(ang(i)), cy+rad*Math.sin(ang(i))];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="230">`;
  // リング
  for(let g=1;g<=5;g++){
    const rr=R*g/5;
    let p='';
    for(let i=0;i<N;i++){ const [x,y]=pt(i,rr); p+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }
    s+=`<path d="${p}Z" fill="none" stroke="rgba(200,162,76,.14)" stroke-width="1"/>`;
  }
  // 軸＋ラベル
  for(let i=0;i<N;i++){
    const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(200,162,76,.12)"/>`;
    const [lx,ly]=pt(i,R+15);
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" fill="#C8A24C" font-size="14" text-anchor="middle" font-family="serif">${labels[i]}</text>`;
  }
  // データ
  setsArr.forEach((vals,si)=>{
    const col=colors[si]; let p='';
    for(let i=0;i<N;i++){ const [x,y]=pt(i, R*Math.max(0.04,vals[i]/MAX)); p+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }
    s+=`<path d="${p}Z" fill="${col}" fill-opacity="0.22" stroke="${col}" stroke-width="2"/>`;
    for(let i=0;i<N;i++){ const [x,y]=pt(i, R*Math.max(0.04,vals[i]/MAX)); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${col}"/>`; }
  });
  s+=`</svg>`;
  return s;
}

/* ============ 折れ線（強度色分け） ============ */
function lineChart(records, std){
  const targets={b:parseInt((std.b.split('×')[1]||'')), i:parseInt((std.i.split('×')[1]||'')), p:parseInt((std.p.split('×')[1]||''))};
  const W=320,H=150,pl=28,pr=12,pt=12,pb=26, n=records.length;
  const vals=records.map(r=>+r.reps||0);
  let maxV=Math.max(...vals, targets.b||0, targets.i||0, targets.p||0, 1);
  const X=i=> n===1? (pl+(W-pl-pr)/2) : pl+(W-pl-pr)*i/(n-1);
  const Y=v=> pt+(H-pt-pb)*(1-v/maxV);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
  s+=`<line x1="${pl}" y1="${Y(0)}" x2="${W-pr}" y2="${Y(0)}" stroke="rgba(200,162,76,.18)"/>`;
  s+=`<text x="${pl-4}" y="${pt+4}" fill="#8b8f99" font-size="9" text-anchor="end">${maxV}</text>`;
  s+=`<text x="${pl-4}" y="${Y(0)}" fill="#8b8f99" font-size="9" text-anchor="end">0</text>`;
  const present={};
  SER.forEach(se=>{
    const pts=[]; records.forEach((r,i)=>{ if((r.intensity||'')===se.k) pts.push([X(i),Y(+r.reps||0)]); });
    if(!pts.length) return; present[se.k]=true;
    if(targets[se.k]){ const ty=Y(targets[se.k]); s+=`<line x1="${pl}" y1="${ty}" x2="${W-pr}" y2="${ty}" stroke="${se.c}" stroke-dasharray="3 4" opacity=".4"/>`; }
    if(pts.length>1) s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${se.c}" stroke-width="2"/>`;
    s+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${se.c}"/>`).join('');
  });
  s+=`<text x="${X(0)}" y="${H-8}" fill="#8b8f99" font-size="9" text-anchor="start">${records[0].date}</text>`;
  s+=`<text x="${X(n-1)}" y="${H-8}" fill="#8b8f99" font-size="9" text-anchor="end">${records[n-1].date}</text>`;
  s+=`</svg>`;
  let leg='<div class="legend">'+SER.filter(se=>present[se.k]).map(se=>`<span><i style="background:${se.c}"></i>${se.l}</span>`).join('')+'</div>';
  return s+leg;
}

/* ============ インタラクション ============ */
function tapFlash(el, fn){
  el.classList.add('flash');
  setTimeout(()=>{ el.classList.remove('flash'); fn(); }, 320);
}

function tapStep(el, key, i){
  tapFlash(el, ()=>nav('record',{exKey:key, step:i}));
}

function selStd(el){
  const all=el.parentNode.querySelectorAll('.std');
  const on=el.classList.contains('sel');
  all.forEach(x=>x.classList.remove('sel'));
  const sets=document.getElementById('inSets'), reps=document.getElementById('inReps');
  if(on){ if(reps) reps.value=''; return; }
  el.classList.add('sel');
  const v=el.querySelector('.v').textContent.trim();
  const parts=v.split('×');
  if(parts.length>=2){ if(sets) sets.value=parseInt(parts[0],10)||1; if(reps) reps.value=parseInt(parts[1],10)||0; }
  else { const m=v.match(/(\d+)分/), s2=v.match(/(\d+)秒/);
         if(sets) sets.value=1; if(reps) reps.value = m?(parseInt(m[1],10)*60):(s2?parseInt(s2[1],10):0); }
}

/* ---- モーダル基盤 ---- */
function modal(html, center){
  closeModal();
  const d=document.createElement('div'); d.className='ovl'+(center?' center':''); d.id='modal';
  d.innerHTML=html; d.onclick=e=>{ if(e.target===d) closeModal(); };
  document.body.appendChild(d);
}
function closeModal(){ const m=document.getElementById('modal'); if(m) m.remove(); }

let imgState='a';
function imgPopup(key,i){
  stopFlip();
  const d=document.createElement('div'); d.id='imgfull';
  d.style.cssText='position:fixed;inset:0;z-index:85;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fade .2s';
  d.innerHTML=`<div id="ifimg" style="width:88%;max-width:430px;aspect-ratio:4/3;border:1px solid rgba(200,162,76,.3);border-radius:16px;display:grid;place-items:center;background:#0d0f13;color:#ECE6D8;font-size:54px;font-family:var(--serif)"></div>
    <div id="ifcap" style="color:#C8A24C;font-size:14px;font-family:var(--serif)"></div>
    <div style="color:#8b8f99;font-size:12px">タップで戻る</div>`;
  d.onclick=()=>{ stopFlip(); d.remove(); };
  document.body.appendChild(d);
  const img=d.querySelector('#ifimg'), cap=d.querySelector('#ifcap');
  imgState='a';
  function show(){ img.textContent = imgState==='a'?'①':'②';
    cap.textContent = (imgState==='a'?'開始ポジション':'動作の終点')+'　'+key.slice(0,1)+'-'+i+imgState; }
  show();
  flipTimer=setInterval(()=>{ imgState=imgState==='a'?'b':'a'; show(); }, 900);
}
let flipTimer=null;
function stopFlip(){ if(flipTimer){ clearInterval(flipTimer); flipTimer=null; } }

function sendPhrase(name){
  let body='';
  for(const cat in PHRASES){
    body+=`<div class="phrase-cat">${cat}</div>`;
    body+=PHRASES[cat].map(p=>`<div class="phrase" onclick="closeModal();toast('${name}に送りました')">${p}</div>`).join('');
  }
  modal(`<div class="sheet"><h3>${name} に送る</h3><p class="sub">定型文をタップで送信</p>${body}<button class="btnghost" onclick="closeModal()">閉じる</button></div>`);
}

function rankList(){
  const cur=rankOf(SUM);
  const rows=RANKS.map((r,i)=>{
    const next=RANKS[i+1]; const range = next ? `${r.min}〜${next.min-1}` : `${r.min}`;
    const isCur = r.name===cur.name;
    return `<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;margin-bottom:7px;
       border:1px solid ${isCur?'var(--kin)':'var(--line)'};background:${isCur?'rgba(200,162,76,.14)':'rgba(255,255,255,.02)'}">
       <div style="width:26px;font-family:var(--serif);color:${isCur?'var(--kin-bright)':'var(--sub)'};font-size:15px">${i+1}</div>
       <div style="flex:1;font-family:var(--serif);font-size:16px;color:${isCur?'var(--kin-bright)':'var(--washi)'}">${r.name}</div>
       <div style="font-size:11px;color:var(--sub)">合計 ${range}</div>
       ${isCur?'<div style="font-size:10px;color:var(--kin);font-weight:700">現在地</div>':''}
     </div>`;
  }).join('');
  modal(`<div class="sheet">
    <h3>階級一覧</h3>
    <p class="sub">六大修行の合計ステップ（最大60）で昇級。現在：${cur.name}</p>
    <div style="max-height:60vh;overflow:auto;margin-top:6px">${rows}</div>
    <button class="btnghost" onclick="closeModal()">閉じる</button>
  </div>`);
}

/* ---- トースト ---- */
let tt;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2b1c;color:#bfe6c0;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:opacity .2s;border:1px solid rgba(127,176,105,.4)';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1'; clearTimeout(tt); tt=setTimeout(()=>t.style.opacity='0',1500);
}

  {big:'🔥', tt:'準備はできた', tx:'さあ、最初の一歩を刻もう。<br>アバターはプロフィールから作れます。'},
];
let tutI=0;
function openTut(){ tutI=0; document.getElementById('tut').style.display='flex'; renderTut(); }
function closeTut(){ stopFlip(); document.getElementById('tut').style.display='none'; }
function renderTut(){
  const t=TUT[tutI];
  let extra='';
  if(t.who) extra=`<div class="speech">${t.speech}</div>`;
  if(t.uname) extra=`<div style="width:280px"><input type="text" placeholder="ユーザー名を入力" style="width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(200,162,76,.3);border-radius:10px;color:#ECE6D8;padding:12px;font-size:16px;text-align:center"><p style="font-size:11px;color:#8b8f99;margin:8px 0 0">2回目まで自由に変更可・3回目以降は1年間ロック</p></div>`;
  if(t.slider) extra=`<div style="width:280px"><input type="range" min="2" max="7" value="4" style="width:100%;accent-color:#C8A24C" oninput="document.getElementById('tg').textContent=this.value"><div style="color:#C8A24C;font-family:serif;font-size:18px">週 <span id="tg">4</span> 日</div></div>`;
  document.getElementById('tutStage').innerHTML=`<div class="big">${t.big}</div><div class="tt">${t.tt}</div>${t.tx?`<div class="tx">${t.tx}</div>`:''}${extra}`;
  document.getElementById('tutDots').innerHTML=TUT.map((_,i)=>`<i class="${i===tutI?'on':''}"></i>`).join('');
  document.getElementById('tutNext').textContent = tutI===TUT.length-1 ? 'はじめる' : '次へ';
}
function tutNext(){ if(tutI<TUT.length-1){ tutI++; renderTut(); } else { closeTut(); nav('home'); } }
