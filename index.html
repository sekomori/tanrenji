<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鍛錬寺</title>
<meta name="theme-color" content="#0c0e12">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鍛錬寺">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 墨 — warm ink, not neutral black */
    --sumi:#141110; --sumi2:#1E1916; --sumi3:#2A231D;
    /* 和紙 */
    --washi:#F4ECDC; --sub:#A79A87; --faint:#6E6355;
    /* 朱 = 行動・炎・現在 */
    --shu:#E5482E; --shu2:#FF6B4A; --shu-deep:#B93A24;
    /* 金 = 褒賞・段位・経験値 */
    --kin:#D9AC52; --kin2:#F2CF7E;
    --ai:#82A7BC; --matsu:#86B573;
    --line:rgba(244,236,220,.10); --line2:rgba(244,236,220,.18);
    --card:#1E1916; --card2:#262019;
    --serif:'Shippori Mincho',"Hiragino Mincho ProN",serif;
    --sans:'Zen Kaku Gothic New',"Hiragino Kaku Gothic ProN",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; background:#000; font-family:var(--sans); color:var(--washi); }
  body{ display:flex; justify-content:center; }
  #app{ position:relative; width:100%; max-width:460px; min-height:100vh; background:var(--sumi); isolation:isolate; }
  #bg{ position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; height:100vh; z-index:0; pointer-events:none; overflow:hidden; }
  #bg .bgimg{ position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s; opacity:.5; }
  #bg .bgimg.t1{ background-image:url('images/t1.png'); }
  #bg .bgimg.t2{ background-image:url('images/t2.png'); }
  #bg .bgimg.t3{ background-image:url('images/t3.png'); }
  #bg .vig{ position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,16,.72) 0%,rgba(20,17,16,.86) 45%,rgba(20,17,16,.95) 100%); }
  #main{ position:relative;z-index:1;padding:18px 16px 130px;min-height:100vh; }
  .scr{ animation:fade .26s ease; }
  @keyframes fade{ from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;} }

  /* ── 見出し（朱印パターン） ── */
  .eyebrow{ font-size:10px;letter-spacing:.42em;color:var(--shu);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:8px; }
  .eyebrow::before{ content:"";width:9px;height:9px;background:var(--shu);border-radius:2px;flex:0 0 auto; }
  .phead{ margin:2px 2px 18px; }
  .phead .pttl{ font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:.1em;margin-top:6px;line-height:1.15; }
  .brand{ display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 18px;gap:10px; }
  .logo b{ font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:.1em;color:var(--washi); }
  .ver{ font-size:10px;color:var(--faint);letter-spacing:.12em;margin-top:3px; }
  .bell{ position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;background:var(--card);cursor:pointer;flex:0 0 auto; }
  .bell:active{ transform:scale(.94); }
  .bell .dot{ position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--shu);box-shadow:0 0 6px var(--shu); }
  .h{ font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.14em;margin:24px 2px 12px;color:var(--washi);display:flex;align-items:center;gap:8px; }
  .h::before{ content:"";width:8px;height:8px;background:var(--shu);border-radius:2px;flex:0 0 auto; }
  .top{ display:flex;align-items:center;gap:12px;margin:2px 0 16px; }
  .back{ width:44px;height:44px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--washi);display:grid;place-items:center;cursor:pointer;font-size:20px; }
  .back:active{ transform:scale(.94); }
  .top .ttl{ font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.05em;line-height:1.3; }
  .top .ttl small{ display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--sub);margin-top:2px;letter-spacing:.02em; }
  .bar{ height:10px;border-radius:8px;background:rgba(244,236,220,.08);overflow:hidden; }
  .bar>i{ display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--kin),var(--kin2));box-shadow:0 0 10px rgba(217,172,82,.35);transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .badge{ font-size:11px;background:var(--shu);color:#fff;padding:2px 8px;border-radius:8px;margin-left:6px;font-weight:700;letter-spacing:.04em; }

  /* ── ホーム：円相ヒーロー ── */
  .hero{ display:flex;align-items:center;gap:18px;padding:20px;border-radius:22px;background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line2);margin-bottom:12px;position:relative;overflow:hidden; }
  .hero::after{ content:"炎";position:absolute;right:-14px;bottom:-26px;font-family:var(--serif);font-size:110px;font-weight:800;color:rgba(229,72,46,.05);pointer-events:none; }
  .hero .enso{ flex:0 0 auto;position:relative;width:96px;height:96px; }
  .hero .enso .flame{ position:absolute;inset:0;display:grid;place-items:center;font-size:34px;filter:drop-shadow(0 0 10px rgba(229,72,46,.55)); }
  .hero .htxt{ flex:1;min-width:0; }
  .hero .hlabel{ font-size:10px;letter-spacing:.34em;color:var(--shu);font-weight:700; }
  .hero .hdays{ font-family:var(--serif);font-size:34px;font-weight:800;line-height:1.1;margin-top:2px; }
  .hero .hdays small{ font-size:16px;letter-spacing:.1em;margin-left:2px; }
  .hero .hsub{ font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5; }
  .restbtn{ margin-top:9px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .restbtn:active{ transform:scale(.96);background:var(--card2); }
  .xp{ padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px; }
  .xp .row{ display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:500;letter-spacing:.04em; }
  .xp .row b{ color:var(--kin);font-family:var(--serif);font-size:16px;font-weight:700; }

  /* ── 種目カード ── */
  .stack{ display:flex;flex-direction:column;gap:10px; }
  .card{ display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .2s; }
  .card:active{ transform:scale(.98); }
  .card .ring{ flex:0 0 auto;position:relative; }
  .card .body{ flex:1;min-width:0; }
  .card .nm{ font-size:16px;font-weight:700;letter-spacing:.02em; }
  .card .st{ font-size:12px;color:var(--sub);margin-top:3px;font-weight:500; }
  .card .st b{ color:var(--kin);font-weight:700; }
  .card .chev{ color:var(--faint);font-size:22px;margin-left:4px; }
  .card.done{ border-color:rgba(217,172,82,.5); }
  @keyframes flash{ 0%{background:var(--card);}40%{background:rgba(229,72,46,.18);}100%{background:var(--card);} }
  .flash{ animation:flash .35s ease; }

  /* ── ステップ一覧 ── */
  #steplist{ display:flex;flex-direction:column;gap:10px;padding-bottom:200px; }
  .srow{ display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .12s; }
  .srow:active{ transform:scale(.98); }
  .srow.current{ border:1.5px solid var(--shu);background:linear-gradient(145deg,rgba(229,72,46,.10),var(--card)); }
  .srow.current .nm{ font-size:18px; }
  .srow.current .th{ width:84px;height:84px; }
  .srow .txt{ flex:1;min-width:0; }
  .srow .n{ font-size:11px;color:var(--sub);letter-spacing:.1em;font-weight:700; }
  .srow .nm{ font-size:15px;font-weight:700;margin-top:3px;line-height:1.35; }
  .srow .th{ width:56px;height:56px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--sumi3);display:grid;place-items:center;font-size:11px;color:var(--faint);transition:width .15s,height .15s; }
  .srow.cleared .n{ color:var(--kin); }

  /* ── 記録画面 ── */
  .memo-prev{ border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 15px;margin-bottom:10px; }
  .memo-prev .lbl{ font-size:12px;color:var(--kin);cursor:pointer;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.04em; }
  .memo-prev .bd{ font-size:13px;color:var(--washi);margin-top:8px;line-height:1.6; }
  .inrow{ display:flex;gap:8px;align-items:flex-end;margin-bottom:10px; }
  .inrow .f{ flex:1; }
  .inrow .f label{ font-size:11px;color:var(--sub);display:block;margin-bottom:5px;font-weight:700;letter-spacing:.06em; }
  .inrow input{ width:100%;background:var(--sumi3);border:1.5px solid var(--line2);border-radius:12px;color:var(--washi);padding:13px 12px;font-size:17px;font-weight:700;font-family:var(--sans);text-align:center; }
  .inrow input:focus{ outline:none;border-color:var(--shu); }
  .recbtn{ flex:1.15;background:linear-gradient(135deg,var(--shu),var(--shu2));color:#fff;border:none;border-radius:12px;padding:13px 6px;font-weight:900;font-size:15px;letter-spacing:.14em;cursor:pointer;height:50px;font-family:var(--sans);box-shadow:0 4px 14px rgba(229,72,46,.3); }
  .recbtn:active{ transform:scale(.97); }
  .memrow{ display:flex;gap:8px;margin-bottom:8px; }
  .memrow input{ flex:1;background:var(--sumi3);border:1px solid var(--line2);border-radius:12px;color:var(--washi);padding:12px;font-size:15px;font-family:var(--sans); }
  .memrow input:focus{ outline:none;border-color:var(--kin); }
  .histbtn{ flex:0 0 auto;min-width:50px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--washi);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .histbtn:active{ transform:scale(.96);background:var(--card2); }
  .divider{ height:1px;background:var(--line);margin:20px 0 4px; }
  .chartbox{ border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 12px 8px; }
  .legend{ display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--sub);margin-top:8px;font-weight:500; }
  .legend i{ display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle; }
  .log{ padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer; }
  .log .lr{ display:flex;justify-content:space-between;font-size:13px;align-items:center; }
  .log .d{ color:var(--sub);display:flex;align-items:center;gap:7px;font-weight:500; }
  .log .r{ font-weight:700;font-family:var(--serif);font-size:15px; }
  .itag{ font-size:11px;padding:2px 8px;border-radius:8px;color:#1a1206;font-weight:700;background:var(--kin); }
  .log .ln{ font-size:12px;color:var(--sub);margin-top:6px;padding:8px 10px;background:var(--sumi3);border-radius:10px;display:none;line-height:1.5; }
  .log.open .ln{ display:block; }
  .log .memo-hint{ font-size:12px;color:var(--kin);margin-left:2px; }

  /* 練度上昇演出 */
  #xpPop{ position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;pointer-events:none;display:none;text-align:center; }
  #xpPop .xpnum{ font-family:var(--serif);font-size:60px;font-weight:800;color:var(--kin2);text-shadow:0 0 24px rgba(217,172,82,.85),0 0 48px rgba(217,172,82,.4);animation:xpbounce .6s ease; }
  #xpPop .xplabel{ font-size:15px;color:var(--washi);letter-spacing:.3em;margin-top:6px;font-weight:700; }
  .sparkle{ position:absolute;border-radius:50%;animation:spark 1s ease forwards; }
  @keyframes xpbounce{ 0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.18);}100%{transform:scale(1);opacity:1;} }
  @keyframes spark{ 0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);} }

  /* ── 試練・功績 ── */
  .mission{ border:1px solid var(--line2);border-radius:20px;background:var(--card);padding:18px;margin-bottom:14px; }
  .mission .t{ font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.06em; }
  .mission .pr{ font-size:12px;color:var(--sub);margin:12px 0 8px;display:flex;justify-content:space-between;font-weight:500; }
  .mission .pr b{ color:var(--kin);font-family:var(--serif);font-size:14px; }
  .relics{ display:grid;grid-template-columns:repeat(4,1fr);gap:10px; }
  .relic{ aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-align:center;gap:3px;font-size:11px;color:var(--sub);cursor:pointer;font-weight:500; }
  .relic:active{ transform:scale(.95); }
  .relic .em{ font-size:26px; }
  .relic.locked{ opacity:.35; }
  .relic.got{ border-color:rgba(217,172,82,.55);color:var(--washi);background:linear-gradient(145deg,rgba(217,172,82,.10),var(--card)); }
  .relic.got .em{ filter:drop-shadow(0 0 6px rgba(217,172,82,.55)); }

  /* ── 門下生 ── */
  .react-hist{ border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;margin-bottom:10px; }
  .react-row{ display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line); }
  .react-row:last-child{ border-bottom:none; }
  .react-row .av{ width:52px;height:52px;border-radius:50%;background:var(--sumi3);border:1px solid var(--line2);display:grid;place-items:center;font-size:26px;flex:0 0 auto; }
  .react-row .info{ flex:1;font-size:13px; }
  .react-row .info .who{ color:var(--kin);font-size:12px;font-weight:700; }
  .react-row .tm{ font-size:11px;color:var(--faint); }
  .friend{ display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:transform .12s; }
  .friend:active{ transform:scale(.98); }
  .friend .av{ width:56px;height:56px;border-radius:50%;background:var(--sumi3);border:1px solid var(--line2);display:grid;place-items:center;font-size:27px;flex:0 0 auto; }
  .friend .nm{ font-size:15px;font-weight:700; }
  .friend .sk{ font-size:12px;color:var(--sub);margin-top:3px;font-weight:500; }
  .friend .chev{ margin-left:auto;color:var(--faint);font-size:20px; }
  .addbtn{ padding:10px 16px;border-radius:12px;border:1.5px dashed var(--line2);background:transparent;color:var(--shu);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .addbtn:active{ transform:scale(.96); }

  /* ── 己 ── */
  .prof-top{ display:flex;align-items:center;gap:14px;margin-bottom:16px; }
  .avatar{ width:76px;height:76px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sumi3),var(--sumi2));border:2.5px solid var(--kin);display:grid;place-items:center;font-size:34px;cursor:pointer; }
  .avatar:active{ transform:scale(.95); }
  .prof-info{ flex:1;min-width:0; }
  .prof-info .pname{ font-family:var(--serif);font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
  .prof-info .pid{ font-size:12px;color:var(--faint);margin-top:2px; }
  .gear{ width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:19px;flex:0 0 auto; }
  .gear:active{ transform:scale(.94); }
  .stat3{ display:flex;gap:10px;margin-bottom:8px; }
  .stat{ flex:1;text-align:center;padding:15px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line); }
  .stat b{ display:block;font-family:var(--serif);font-size:24px;font-weight:800;color:var(--kin); }
  .stat small{ font-size:10px;color:var(--sub);letter-spacing:.08em;font-weight:700;display:block;margin-top:3px; }

  /* ── タブバー ── */
  .tabbar{ position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(18,15,13,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20; }
  .tab{ width:56px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--faint);border-radius:14px;transition:all .18s; }
  .tab svg{ width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
  .tab.on{ color:var(--shu);background:rgba(229,72,46,.14); }
  .tab:active{ transform:scale(.9); }

  /* ── シート/モーダル ── */
  .ovl{ position:fixed;inset:0;z-index:50;background:rgba(10,8,7,.7);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;backdrop-filter:blur(3px); }
  .ovl.center{ align-items:center; }
  .sheet{ width:100%;max-width:460px;background:#221C17;border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow-y:auto; }
  .sheet.card-c{ border-radius:24px;margin:0 18px;max-height:80vh; }
  @keyframes up{ from{transform:translateY(36px);opacity:.4;}to{transform:none;opacity:1;} }
  .sheet h3{ font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:.06em; }
  .sheet p.sub{ font-size:12px;color:var(--sub);margin:0 0 8px;line-height:1.5; }
  .sheet label{ display:block;font-size:11px;color:var(--sub);margin:16px 0 6px;font-weight:700;letter-spacing:.08em; }
  .sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{ width:100%;background:var(--sumi3);border:1.5px solid var(--line2);border-radius:12px;color:var(--washi);padding:12px;font-size:16px;font-family:var(--sans); }
  .sheet input:focus{ outline:none;border-color:var(--shu); }
  .sheet input[type=range]{ width:100%;accent-color:var(--shu); }
  .seg{ display:flex;gap:8px; }
  .seg button{ flex:1;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--sumi3);color:var(--washi);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .seg button.sel{ background:rgba(229,72,46,.16);border-color:var(--shu);color:var(--shu2); }
  .btnprime{ width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--shu),var(--shu2));color:#fff;font-weight:900;font-size:15px;letter-spacing:.1em;cursor:pointer;font-family:var(--sans);box-shadow:0 4px 16px rgba(229,72,46,.28); }
  .btnprime:active{ transform:scale(.97); }
  .btnghost{ width:100%;margin-top:10px;padding:13px;border:1px solid var(--line2);border-radius:14px;background:transparent;color:var(--washi);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .btnghost:active{ background:var(--card2); }
  .btndanger{ background:var(--shu-deep);border-color:var(--shu-deep);color:#fff; }

  .react-btns{ display:flex;gap:10px;margin-top:14px; }
  .react-btns button{ flex:1;padding:13px 6px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--washi);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans); }
  .react-btns button:active{ background:rgba(229,72,46,.2);transform:scale(.96); }

  /* 指南 */
  #tut{ position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,var(--sumi),#1B1410);display:none;flex-direction:column;padding:34px 24px calc(26px + env(safe-area-inset-bottom)); }
  #tut .skip{ position:absolute;top:20px;right:20px;color:var(--faint);font-size:13px;cursor:pointer;font-weight:700; }
  #tut .stage{ flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px; }
